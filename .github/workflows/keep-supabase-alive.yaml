name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch: {}
jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -sf -o /dev/null -w "%{http_code}\n" \
            "${{ vars.SUPABASE_URL }}/rest/v1/inventory?select=id&limit=1" \
            -H "apikey: ${{ vars.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ vars.SUPABASE_KEY }}"
